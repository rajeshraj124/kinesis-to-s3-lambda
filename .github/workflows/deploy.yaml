name: Build, Push, and Deploy Lambda

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy (defaults to short commit SHA)"
        required: false
        type: string

permissions:
  id-token: write   # Required for requesting the OIDC JWT
  contents: read    # Required for actions/checkout

concurrency:
  group: deploy-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG:-${COMMIT_SHA::7}}"
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$REGISTRY/$REPOSITORY:latest"

          docker build --platform linux/amd64 --provenance=false \
            -t "$IMAGE_URI" -t "$LATEST_URI" ./lambda

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy or Update Lambda Function
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          KINESIS_STREAM_ARN: ${{ secrets.KINESIS_STREAM_ARN }}
          BUCKET_NAME: ${{ vars.BUCKET_NAME }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'kinesis' }}
          BATCH_SIZE: ${{ vars.BATCH_SIZE || '5000' }}
          BATCH_WINDOW: ${{ vars.BATCH_WINDOW || '30' }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
        run: |
          set -euo pipefail
          for v in FUNCTION_NAME REGION BUCKET_NAME KINESIS_STREAM_ARN ROLE_ARN; do
            [ -n "${!v}" ] || { echo "::error::Missing value for $v (set the GitHub variable/secret)"; exit 1; }
          done
          ENV_VARS="Variables={BUCKET_NAME=$BUCKET_NAME,S3_PREFIX=$S3_PREFIX}"

          if aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" > /dev/null 2>&1; then
            echo "Function exists. Updating code with image: $IMAGE_URI"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" \
              --region "$REGION" > /dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$REGION"

            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --environment "$ENV_VARS" \
              --region "$REGION" > /dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$REGION"
            echo "Lambda function updated."
          else
            echo "Function does not exist. Creating with image: $IMAGE_URI"
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$ROLE_ARN" \
              --timeout 30 \
              --memory-size 256 \
              --architectures x86_64 \
              --environment "$ENV_VARS" \
              --region "$REGION" > /dev/null
            aws lambda wait function-active-v2 --function-name "$FUNCTION_NAME" --region "$REGION"

            echo "Lambda function created and active."
          fi

            MAPPING_UUID=$(aws lambda list-event-source-mappings \
            --function-name "$FUNCTION_NAME" \
            --event-source-arn "$KINESIS_STREAM_ARN" \
            --region "$REGION" --query 'EventSourceMappings[0].UUID' --output text)

          if [ "$MAPPING_UUID" = "None" ]; then
            aws lambda create-event-source-mapping \
              --function-name "$FUNCTION_NAME" \
              --event-source-arn "$KINESIS_STREAM_ARN" \
              --starting-position LATEST \
              --batch-size "$BATCH_SIZE" \
              --maximum-batching-window-in-seconds "$BATCH_WINDOW" \
              --bisect-batch-on-function-error \
              --maximum-retry-attempts "$MAX_RETRIES" \
              --region "$REGION" > /dev/null
            echo "Event source mapping created."
          else
            aws lambda update-event-source-mapping \
              --uuid "$MAPPING_UUID" \
              --batch-size "$BATCH_SIZE" \
              --maximum-batching-window-in-seconds "$BATCH_WINDOW" \
              --bisect-batch-on-function-error \
              --maximum-retry-attempts "$MAX_RETRIES" \
              --region "$REGION" > /dev/null
            echo "Event source mapping $MAPPING_UUID updated."
          fi
